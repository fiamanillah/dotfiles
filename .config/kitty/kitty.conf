# ==========================================
# KITTY TERMINAL CONFIG
# Theme: Catppuccin Mocha + Cyan accent
# ==========================================

# Font
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Performance
sync_to_monitor yes
repaint_delay   8
input_delay     2

# Window
window_padding_width   8
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    yes

# Transparency & Blur
background_opacity 0.88
background_blur    1

# Colors
background #11111b
foreground #cdd6f4

# Cursor
cursor              #00ffff
cursor_text_color   #11111b
cursor_shape        block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail        3
cursor_trail_decay  0.1 0.4
cursor_trail_start_threshold 2

# Selection
selection_background #00ffff
selection_foreground #11111b

# URL
url_color #89b4fa
url_style curly

# 16 Terminal Colors
color0  #1e1e2e
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #00ffff
color11 #00cccc
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# Tab Bar
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2

active_tab_foreground   #11111b
active_tab_background   #00ffff
active_tab_font_style   bold
inactive_tab_foreground #a6adc8
inactive_tab_background #1e1e2e
inactive_tab_font_style normal
tab_bar_background      #11111b
tab_title_template      " {title} "

# System
linux_display_server wayland
enable_audio_bell    no
visual_bell_duration 0.0

# Keymaps
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwdw_window_with_cwd
