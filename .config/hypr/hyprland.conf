# ==========================================
# HYPRLAND MAIN CONFIG
# ==========================================

### PROGRAMS ###
$terminal    = kitty
$fileManager = nautilus
$menu        = fuzzel          # Changed from rofi to fuzzel

source = ~/.config/hypr/colors.conf       # ← Load palette first
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/looks.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/monitors.conf

#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pypr
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = hyprpm reload -n
exec-once = wayle panel start
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/hyprpaper-changer.sh
exec-once = numlockx on

# Night mode — uncomment once hyprsunset is installed
# exec-once = hyprsunset

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,20
env = XCURSOR_THEME,Bibata-Modern-Classic   # ← Set cursor theme
env = HYPRCURSOR_SIZE,20
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots

# Toolkit hints for Wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

xwayland {
    force_zero_scaling = true
}

# ==========================================
# GPU — uncomment the correct one
# ==========================================
source = ~/.config/hypr/env_nvidia.conf   # Laptop (NVIDIA)
# source = ~/.config/hypr/env_intel.conf  # Office PC (Intel only)

#############
### INPUT ###
#############
input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options =
    kb_rules   =

    follow_mouse  = 2
    sensitivity   = 0

    touchpad {
        natural_scroll      = true
        disable_while_typing = true
        tap-to-click        = true      # ← Tap to click on touchpad
        scroll_factor       = 0.8
    }
}

################
### GESTURES ###
################
gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert   = true
}

gesture = 3, horizontal, workspace
gesture = 3, down,       mod: ALT,   close
gesture = 3, up,         mod: SUPER, scale: 1.5, fullscreen

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

# ==========================================
# PLUGIN CONFIGURATION
# ==========================================
plugin {
    split-monitor-workspaces {
        count                      = 10
        keep_focused               = 0
        enable_notifications       = 0
        enable_persistent_workspaces = 0
    }

    hy3 {
        no_gaps_when_only   = 0
        node_collapse_policy = 2

        tabs {
            height      = 20
            padding     = 5
            render_text = true
            text_center = true
            text_font   = CaskaydiaCove Nerd Font Bold
            text_height = 9
            col.active   = rgba(ff9800aa)
            col.inactive = rgba(1e1e2eaa)
            col.active.border   = rgba(ff9800ff)
            col.inactive.border = rgba(313244aa)
        }

        autotile {
            enable         = true
            trigger_width  = 800
            trigger_height = 500
        }
    }
}
