# ==========================================
# LOOKS & FEEL
# Depends on colors.conf being sourced first
# ==========================================

general {
    gaps_in = 3
    gaps_out = 6

    border_size = 2

    # Uses variables from colors.conf
    col.active_border   = rgba(00ffffff) rgba(00ccccff) 45deg
    col.inactive_border = rgba(313244aa)

    resize_on_border = true          # Grab window edges to resize — quality of life
    allow_tearing    = false
    layout           = hy3
}

decoration {
    rounding       = 14
    rounding_power = 2

    active_opacity     = 0.96
    inactive_opacity   = 0.88
    fullscreen_opacity = 1.0

    shadow {
        enabled      = false
        range        = 10
        render_power = 1
        color        = rgba(00ffff1a)    # Very subtle cyan-tinted shadow
        color_inactive = rgba(00000033)
    }

    blur {
        enabled        = true
        size           = 8              # Improved blur size
        passes         = 4              # Improved blur passes
        vibrancy       = 0.9
        vibrancy_darkness = 0.3
        ignore_opacity = true
        xray           = false
        special        = true           # Blur special workspace bg
    }
}

animations {
    enabled = true

    # ── Bezier curves ──────────────────────────────────────────────────
    bezier = wind,          0.05, 0.85, 0.03, 0.97
    bezier = winIn,         0.07, 0.88, 0.04, 0.99
    bezier = winOut,        0.20, -0.15, 0, 1
    bezier = liner,         1, 1, 1, 1
    bezier = md3_decel,     0.05, 0.80, 0.10, 0.97
    bezier = menu_decel,    0.05, 0.82, 0, 1
    bezier = menu_accel,    0.20, 0, 0.82, 0.10
    bezier = easeOutCirc,   0, 0.48, 0.38, 1
    bezier = overshot,      0.05, 0.85, 0.07, 1.04
    bezier = softAcDecel,   0.20, 0.20, 0.15, 1

    # ── Animations ────────────────────────────────────────────────────

    # Border: loop makes the cyan gradient spin continuously
    animation = border,          1, 1.6,  liner
    animation = borderangle,     1, 80,   liner,     loop   # Changed: once → loop

    # Windows
    animation = windowsIn,       1, 3.5,  winIn,     slide
    animation = windowsOut,      1, 2.8,  easeOutCirc
    animation = windowsMove,     1, 3.0,  wind,      slide

    # Fade
    animation = fade,            1, 2.0,  md3_decel

    # Layers (rofi, fuzzel, notifications)
    animation = layersIn,        1, 2.0,  menu_decel, slide
    animation = layersOut,       1, 1.5,  menu_accel
    animation = fadeLayersIn,    1, 1.8,  menu_decel
    animation = fadeLayersOut,   1, 1.5,  menu_accel

    # Workspaces
    animation = workspaces,      1, 4.0,  menu_decel, slide
    animation = specialWorkspace,1, 2.5,  md3_decel,  slidefadevert 15%
}

dwindle {
    # paseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper  = -1
    disable_hyprland_logo    = true    # Remove the logo
    # vfr                      = true
    mouse_move_enables_dpms  = true    # Wake screen on mouse move
    key_press_enables_dpms   = true    # Wake screen on keypress
}
