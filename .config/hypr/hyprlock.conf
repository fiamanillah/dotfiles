# ==========================================
# HYPRLOCK — Lock Screen
# Theme: Catppuccin Mocha + Cyan accent
# ==========================================

source = $HOME/.config/hypr/colors.conf

# ── Background ────────────────────────────
background {
    monitor    =
    path       = screenshot
    blur_passes  = 4
    blur_size    = 7
    contrast     = 0.85
    brightness   = 0.75
    vibrancy     = 0.20
    vibrancy_darkness = 0.05
}

# ── Profile Picture ───────────────────────
image {
    monitor =
    path = /home/fiamanillah/Pictures/fi.png
    size = 140
    rounding = -1
    border_size = 4
    border_color = $cyan
    position = 0, 240
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $deep_cyan_dim
}

# ── Clock (large, centered high) ──────────
label {
    monitor  =
    text     = $TIME
    color    = $text
    font_size   = 110
    font_family = CaskaydiaCove Nerd Font Bold
    position = 0, 60
    halign   = center
    valign   = center
    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = $deep_cyan_dim
}

# ── Date ──────────────────────────────────
label {
    monitor  =
    text     = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color    = $subtext0
    font_size   = 24
    font_family = CaskaydiaCove Nerd Font
    position = 0, -40
    halign   = center
    valign   = center
    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = rgba(0,0,0,0.5)
}

# ── Greeting ──────────────────────────────
label {
    monitor  =
    text     = Welcome back, Fi
    color    = $text
    font_size   = 18
    font_family = CaskaydiaCove Nerd Font
    position = 0, -90
    halign   = center
    valign   = center
    shadow_passes = 1
    shadow_size   = 2
    shadow_color  = rgba(0,0,0,0.5)
}

# ── Password Input ────────────────────────
input-field {
    monitor  =
    size     = 320, 56

    outline_thickness = 3
    dots_size         = 0.28
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = -1

    # Cyan border glows on focus
    outer_color       = $cyan
    inner_color       = rgba(17, 17, 27, 0.80)
    font_color        = $text
    check_color       = $green
    fail_color        = $red
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition   = 300

    fade_on_empty     = true
    fade_timeout      = 1200
    placeholder_text  = <span foreground="##a6adc8"><i>  Password...</i></span>
    hide_input        = false

    position = 0, -180
    halign   = center
    valign   = center
    rounding = 16
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = $cyan_dim
}

# ── Battery Status ────────────────────────
label {
    monitor =
    text = cmd[update:5000] echo "󰁹 $(cat /sys/class/power_supply/BAT1/capacity)%"
    color = $subtext0
    font_size = 14
    font_family = CaskaydiaCove Nerd Font
    position = 20, 20
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0,0,0,0.5)
}

# ── Music Status ──────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '󰎆  {{title}} - {{artist}}' 2>/dev/null || echo '')"
    color = $subtext0
    font_size = 14
    font_family = CaskaydiaCove Nerd Font
    position = -20, 20
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0,0,0,0.5)
}
