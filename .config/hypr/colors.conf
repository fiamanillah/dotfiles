# ==========================================
# HYPRLAND COLOR PALETTE
# Source this in looks.conf, hyprlock.conf, etc.
# Usage: source = ~/.config/hypr/colors.conf
# ==========================================

# ── Accent Colors ─────────────────────────
$cyan           = rgba(00ffffff)
$cyan_dim       = rgba(00ffff80)
$cyan_faint     = rgba(00ffff1a)
$deep_cyan      = rgba(00ccccff)
$deep_cyan_dim  = rgba(00cccc80)

# ── Catppuccin Mocha Palette ───────────────
$base           = rgba(11111bff)
$mantle         = rgba(181825ff)
$crust          = rgba(1e1e2eff)
$surface0       = rgba(313244ff)
$surface1       = rgba(45475aff)
$surface2       = rgba(585b70ff)
$overlay0       = rgba(6c7086ff)
$text           = rgba(cdd6f4ff)
$subtext1       = rgba(bac2deff)
$subtext0       = rgba(a6adc8ff)

# ── Semantic ──────────────────────────────
$red            = rgba(f38ba8ff)
$green          = rgba(a6e3a1ff)
$yellow         = rgba(f9e2afff)
$blue           = rgba(89b4faff)
$mauve          = rgba(cba6f7ff)
$teal           = rgba(94e2d5ff)
$pink           = rgba(f5c2e7ff)

# ── Border gradients (use in col.* fields) ─
$border_active  = $cyan $deep_cyan 45deg
$border_inactive= $surface0 $surface1 45deg
