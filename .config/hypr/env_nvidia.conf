# ==========================================
# NVIDIA SPECIFIC ENVIRONMENT VARIABLES
# ==========================================

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# 1. Restore Intel as Primary (Required for laptop screen to work)
# Note: In your original file, there was a typo that said card1:card1. 
# It MUST be card2 (Intel) followed by card1 (NVIDIA).
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# 2. Fix Multi-GPU buffer modifiers for NVIDIA
env = AQ_FORCE_LINEAR_BLIT,0

# 3. Disable Hardware Cursors (This completely fixes the external monitor lag)
cursor {
    no_hardware_cursors = true
}