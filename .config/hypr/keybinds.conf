#########################################################################################
# KEYBINDINGS CONFIGURATION
# Engine: hy3 (Manual Tiling & Tabbing)
# Modifier: SUPER (Windows Key)
#########################################################################################

$mainMod = SUPER

# ==========================================
# 1. CORE & APPLICATIONS
# ==========================================
bind = $mainMod, T, exec, $terminal                                      # Standard Terminal
bind = $mainMod SHIFT, T, exec, pypr toggle term                         # Toggle Dropdown Terminal
bind = $mainMod, Q, killactive,                                          # Close Window
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, SPACE, exec, $menu                                      # App Launcher (Primary)
bind = $mainMod, R, exec, $menu                                          # App Launcher (Secondary)
bind = $mainMod, E, exec, $fileManager                                   # File Manager
bind = $mainMod, W, exec, google-chrome-stable --enable-features=UseOzonePlatform --ozone-platform=wayland # Browser
bind = $mainMod, C, exec, sh -c 'cliphist list | rofi -dmenu -p "󰅌 Clipboard" | cliphist decode | wl-copy' # Clipboard

# ==========================================
# 2. VIM-STYLE WINDOW MANAGEMENT (HJKL)
# ==========================================
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, togglefloating,

# Move focus (Vim keys)
bind = $mainMod, H, hy3:movefocus, l
bind = $mainMod, J, hy3:movefocus, d
bind = $mainMod, K, hy3:movefocus, u
bind = $mainMod, L, hy3:movefocus, r

# Move active window (Vim keys + Shift)
bind = $mainMod SHIFT, H, hy3:movewindow, l
bind = $mainMod SHIFT, J, hy3:movewindow, d
bind = $mainMod SHIFT, K, hy3:movewindow, u
bind = $mainMod SHIFT, L, hy3:movewindow, r

# Resize active window (Vim keys + Alt)
binde = $mainMod ALT, H, resizeactive, -20 0
binde = $mainMod ALT, J, resizeactive, 0 20
binde = $mainMod ALT, K, resizeactive, 0 -20
binde = $mainMod ALT, L, resizeactive, 20 0

# Move/resize windows with mouse dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==========================================
# 3. HY3: SPLITTING & TABBING
# ==========================================
bind = $mainMod, V, hy3:makegroup, v             # Split next window vertically
bind = $mainMod, B, hy3:makegroup, h             # Split next window horizontally
bind = $mainMod, G, hy3:changegroup, toggletab   # Toggle tabbing mode for current group

# Group focus traversal (For navigating nested splits)
bind = $mainMod, P, hy3:changefocus, raise       # Select parent group
bind = $mainMod SHIFT, P, hy3:changefocus, lower # Select child window

# ==========================================
# 4. WORKSPACES
# ==========================================
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10

bind = $mainMod SHIFT, 1, split-movetoworkspace, 1
bind = $mainMod SHIFT, 2, split-movetoworkspace, 2
bind = $mainMod SHIFT, 3, split-movetoworkspace, 3
bind = $mainMod SHIFT, 4, split-movetoworkspace, 4
bind = $mainMod SHIFT, 5, split-movetoworkspace, 5
bind = $mainMod SHIFT, 6, split-movetoworkspace, 6
bind = $mainMod SHIFT, 7, split-movetoworkspace, 7
bind = $mainMod SHIFT, 8, split-movetoworkspace, 8
bind = $mainMod SHIFT, 9, split-movetoworkspace, 9
bind = $mainMod SHIFT, 0, split-movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special Workspace (Magic)
bind = $mainMod, grave, togglespecialworkspace, magic           # Super + ` (tilde key)
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# ==========================================
# 5. MULTI-MONITOR CONTROLS
# ==========================================
# Focus Monitor
bind = $mainMod, comma, focusmonitor, l
bind = $mainMod, period, focusmonitor, r

# Move Window to Monitor
bind = $mainMod SHIFT, comma, movewindow, mon:l
bind = $mainMod SHIFT, period, movewindow, mon:r

# Shift Entire Workspace to Monitor
bind = $mainMod ALT, comma, exec, pypr shift_monitors -1
bind = $mainMod ALT, period, exec, pypr shift_monitors +1

# Monitor specific utility
bind = $mainMod SHIFT, B, exec, sh ~/.config/hypr/scripts/rofi_wallpaper_selector.sh

# ==========================================
# 6. SYSTEM CONTROLS & UTILITIES
# ==========================================
# Unified Control Center (Replaces floating Wi-Fi/Bluetooth)
bind = $mainMod, N, exec, swaync-client -t -sw       # Opens Sway Notification/Control Center

# Utilities
bind = CTRL ALT, L, exec, hyprlock                   # Lock Screen
bind = $mainMod, Y, exec, sh ~/.config/hypr/scripts/rgb_keyboard_selector.sh # RGB Keyboard (Moved from K)

# Pyprland Extensions
bind = $mainMod, Tab, exec, pypr expose              # Mission control overview
bind = $mainMod, A, exec, pypr fetch_client_menu     # Rofi window switcher
bind = $mainMod, Z, exec, pypr layout_center toggle  # Centers active window
bind = $mainMod, bracketleft, exec, pypr layout_center prev 
bind = $mainMod, bracketright, exec, pypr layout_center next
bind = $mainMod, Backspace, exec, pypr lost_windows  # Rescue off-screen windows

# ==========================================
# 7. SCREENSHOTS (Hyprshot)
# ==========================================
bind = , Print, exec, hyprshot -m output              # Full Screen
bind = $mainMod, Print, exec, hyprshot -m window      # Active Window
bind = $mainMod SHIFT, S, exec, hyprshot -m region    # Select Region

# ==========================================
# 8. HARDWARE & MEDIA CONTROLS
# ==========================================
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
