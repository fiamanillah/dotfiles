# ==========================================
# FUZZEL — Native Wayland App Launcher
# Theme: Catppuccin Mocha + Cyan accent
# Install: sudo pacman -S fuzzel
# ==========================================

[main]
# Font
font=CaskaydiaCove Nerd Font:size=13

# Display — 12 rows, 1 column (clean list style)
lines=10
width=40
tabs=4

# Behavior
terminal=kitty -e
launch-prefix=
prompt=  
placeholder=Search apps...
icons-enabled=yes
icon-theme=Papirus-Dark

# Fuzzy match
fuzzy-min-length=1

# Animation — feels snappy
show-actions=no
match-mode=fzf

[colors]
# Background: Catppuccin Mocha base
background=11111bef

# Prompt/search area
text=cdd6f4ff
prompt=00ffffff
placeholder=585b70ff

# List items
match=00ffffff
selection=1e1e2eff
selection-text=00ffffff
selection-match=00ccccff

# Border — cyan accent
border=00ffffcc

[border]
width=2
radius=12

[dmenu]
# Used when fuzzel is called as dmenu replacement
prompt=  

[key-bindings]
# Keep muscle memory from rofi
delete-line=Control+u
delete-prev-word=Mod1+BackSpace
